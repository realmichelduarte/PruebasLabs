name: Public synthetic smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public-only file allowlist and secret signatures
        run: node scripts/check-public-safe.mjs
      - name: Run tests with synthetic fixtures only
        run: node --test
